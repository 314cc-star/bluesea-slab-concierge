# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Secrets marked sync: false are typed into the dashboard, never committed.
services:
  - type: web
    name: bluesea-slab-concierge
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: CURRENCY
        value: THB
      - key: DEPOSIT_RATE
        value: "0.5"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RELEASE_MINUTES
        value: "30"
      - key: ROOM_PREVIEW
        value: "false"
      - key: USD_PER_THB
        value: "0.03"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
